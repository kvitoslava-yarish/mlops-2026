# Retrieval + LLM configuration for Lab 3. Every value is logged on each MLflow run, and the
# Lab 4 service reads the same file: the index you evaluate is the index you serve.
corpus:
  files:
    - data/corpus/kpszsu.csv           # Ukrainian Air Force (official)
    - data/corpus/smolii_ukraine.csv   # independent monitoring channel
  since: "2026-07-24"                  # full UTC days, both channels
  until: "2026-10-24"                  # exclusive

ingest:                   # DAG ingest_telegram: 03:45 / 09:45 / 15:45 / 21:45 Kyiv, before each M1 run
  channels: [kpszsu, smolii_ukraine]
  first_since: "2026-10-24"  # the first run back-fills from the end of the DVC corpus
  sleep_s: 0.8               # between preview pages (<= 1.25 req/s)
  max_age_hours:             # newest post older than this fails the run (blocked, markup change);
    kpszsu: 6                # longest silence Jul-Oct 2026: 2.6 h
    smolii_ukraine: 18       # longest silence Jul-Oct 2026: 10.2 h

chunking:
  chunk_chars: 500        # posts are a median of ~55 characters: almost all stay one chunk
  overlap_chars: 100      # only long posts (morning summaries) are split

retrieval:
  window_hours: 3         # posts considered for the question "what threatens Kyiv now?" at time t
  top_k: 8
  embedding_model: e5_small
  embedding_models:       # the parameter varied in the Lab 3 comparison
    e5_small:
      hf_id: intfloat/multilingual-e5-small
      dim: 384
      query_prefix: "query: "
      passage_prefix: "passage: "
    e5_base:
      hf_id: intfloat/multilingual-e5-base
      dim: 768
      query_prefix: "query: "
      passage_prefix: "passage: "
    minilm:
      hf_id: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      dim: 384
      query_prefix: ""
      passage_prefix: ""

llm:
  provider: gemini        # API key from the environment: GEMINI_API_KEY
  model: gemini-3.8-flash      # pinned id, never an alias: the provider re-routes deprecated names
  label_model: gemini-4-argon   # stronger model for the pre-labels, so the answerer is not graded by itself ($2 / $10 per 1M through 2026-11-30)
  temperature: 0.0
  max_output_tokens: 1024
  thinking_budget: 0            # no hidden reasoning for the answer path (billed tokens stay visible)
  # Paid tier, aistudio.google.com/docs/pricing, checked 2026-11-08: $0.75 / $3.75 per 1M tokens
  # through 2026-12-31 ($1.50 / $7.50 from 2027-01-01); output price covers thinking tokens too.
  price_usd_per_1m: {input: 0.75, output: 3.75}

prompts:
  answer: prompts/answer_v1.md
  baseline: prompts/baseline_v1.md
  label: prompts/label_v1.md

eval:
  windows: data/eval/windows.csv
  labels: data/eval/labels.csv
